name: Japanese Script Extractor APK

on:
  push:
    branches: [main]
    paths:
      - 'japanese-script-extractor/**'
      - '.github/workflows/script-extractor-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: japanese-script-extractor
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: japanese-script-extractor-debug
          path: japanese-script-extractor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
