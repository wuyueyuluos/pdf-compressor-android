name: Japanese Script Extractor APK

on:
  push:
    branches: [main]
    paths:
      - 'japanese-script-extractor/**'
      - '.github/workflows/script-extractor-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: japanese-script-extractor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore app icon resources
        run: |
          unzip -o japanese-script-extractor-icon-resources.zip -d app/src/main

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/script-extractor-release.jks
          chmod 600 app/script-extractor-release.jks

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Build optimized signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: japanese-script-extractor-debug
          path: japanese-script-extractor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: japanese-script-extractor-release
          path: japanese-script-extractor/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
